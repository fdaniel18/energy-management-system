spring.application.name=AuthService

spring.datasource.url=jdbc:postgresql://localhost:5432/Credentials
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8083

# Base URL for UserMicroservice (used to create users during registration)
# In Docker this will be overridden via env USERSERVICE_BASE_URL=http://user-service:8080
userservice.base-url=http://localhost:8081

# JWT signing secret (min. 32 bytes). Override with env JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:change-me-dev-only-jwt-secret-key-min-32-bytes}

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
