spring.application.name=DataSimulator

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# DevicesMicroservice URL - use Docker service name when running in Docker
devices.service.url=http://device-service:8080

# Logging
logging.level.com.example.datasimulator=INFO
logging.level.org.springframework.amqp=INFO
